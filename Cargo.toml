[workspace]
members = ["src-tauri", "crates/flasher-core", "crates/flasher-ops", "crates/flasher-cli"]
resolver = "2"

[workspace.package]
version = "0.2.13"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/aircast-one/aircast-flasher"

[workspace.dependencies]
flasher-core = { path = "crates/flasher-core" }
flasher-ops = { path = "crates/flasher-ops" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
