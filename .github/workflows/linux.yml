name: Linux build

# Builds the Aircast Flasher Linux app (AppImage + .deb + .rpm) and uploads them
# as artifacts. Like the Windows job, this is also the only place the Linux
# cfg(target_os="linux") code is actually compiled — it can't be built on macOS
# (Tauri needs webkit2gtk/libsoup system libs).

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/linux.yml"

jobs:
  build:
    # 22.04 ships webkit2gtk-4.1 and an older glibc, so the AppImage runs on a
    # wider range of distros than one built on the latest runner.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl wget file \
            libssl-dev \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build app
        # This CI build only uploads installers as artifacts; it never publishes
        # to the update endpoint. The committed config has createUpdaterArtifacts
        # = true + a pubkey, which makes the raw `tauri build` CLI fail when no
        # TAURI_SIGNING_PRIVATE_KEY is set. Override it off here — updater signing
        # belongs to the release pipeline (desktop-release.yml via tauri-action).
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: aircast-flasher-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
