name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file libssl-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Frontend build (tsc + vite)
        run: npm run build

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Release script tests
        run: npm run test:scripts

      - name: Rust tests
        run: cargo test --workspace

      - name: E2E typecheck
        run: npx tsc -p e2e/tsconfig.json

      - name: Build the app
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # `just e2e` is not run here. The suite drives the real app over
      # WebDriver, and on a GitHub-hosted runner the automation session is
      # handed a blank webview instead of the app's — on Linux regardless of
      # driver provider, and on macOS runners too, while the same commit passes
      # 10/10 on a real desktop. It is a pre-push gate (`just check`), not a
      # CI-skippable step; see the Tests section of the README.
