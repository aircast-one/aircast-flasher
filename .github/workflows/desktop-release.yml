name: Desktop Release

# Builds the Aircast Flasher for macOS/Windows/Linux on a version tag, publishes
# a GitHub release, and mirrors the installers to S3 (downloads.aircast.one)
# under a `flasher/` path with a `releases.json` catalog — mirroring the
# aircast-web desktop-release pipeline.
#
# Required repo/org secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# PAT_TOKEN.
#
# PAT_TOKEN is a PAT with contents:write (fine-grained: Contents = Read and
# write on this repo; classic: `repo`). The built-in GITHUB_TOKEN cannot be used:
# the releases API answers "Resource not accessible by integration" (403) for it
# on this repo even though the job is granted `Contents: write`, because the org
# and repo default workflow permissions are read-only. v0.1.2 failed that way
# with all three platforms built and nothing published.

permissions:
  contents: write

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # production: v1.0.0
      - "v*-staging.*" # staging:    v1.0.0-staging.1
      - "v*-dev.*" # development: v1.0.0-dev.1
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v1.0.1, v1.0.1-dev.0)"
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.config.outputs.version }}
      environment: ${{ steps.config.outputs.environment }}
      is_production: ${{ steps.config.outputs.is_production }}
      s3_path: ${{ steps.config.outputs.s3_path }}
      cloudfront_domain: ${{ steps.config.outputs.cloudfront_domain }}
      downloads_url: ${{ steps.config.outputs.downloads_url }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Require a release token
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "::error::PAT_TOKEN is not set. The built-in GITHUB_TOKEN gets 403" \
                 "from the releases API on this repo, so publishing needs a PAT with" \
                 "contents:write stored as the PAT_TOKEN secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the release scripts
        run: npm run test:scripts

      - id: config
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_production=true" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "s3_path=stable" >> "$GITHUB_OUTPUT"
            echo "cloudfront_domain=downloads.aircast.one" >> "$GITHUB_OUTPUT"
            echo "downloads_url=https://downloads.aircast.one" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -staging\. ]]; then
            echo "is_production=false" >> "$GITHUB_OUTPUT"
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "s3_path=staging" >> "$GITHUB_OUTPUT"
            echo "cloudfront_domain=downloads.staging.aircast.one" >> "$GITHUB_OUTPUT"
            echo "downloads_url=https://downloads.staging.aircast.one" >> "$GITHUB_OUTPUT"
          else
            echo "is_production=false" >> "$GITHUB_OUTPUT"
            echo "environment=development" >> "$GITHUB_OUTPUT"
            echo "s3_path=development" >> "$GITHUB_OUTPUT"
            echo "cloudfront_domain=downloads.dev.aircast.one" >> "$GITHUB_OUTPUT"
            echo "downloads_url=https://downloads.dev.aircast.one" >> "$GITHUB_OUTPUT"
          fi
          echo "Release: $VERSION"

      # Create the release once, here, instead of letting the three build jobs
      # race to create it by tag — that race is what failed v0.1.2, with two of
      # them getting "Resource not accessible by integration" from the releases
      # API after building successfully.
      - name: Ensure the GitHub release exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          V: ${{ steps.config.outputs.version }}
          PRODUCTION: ${{ steps.config.outputs.is_production }}
        run: |
          if ! gh release view "$V" >/dev/null 2>&1; then
            PRE=""
            [ "$PRODUCTION" = "true" ] || PRE="--prerelease"
            gh release create "$V" $PRE \
              --title "Aircast Flasher $V" \
              --notes "See the assets below to download this version."
          fi
          ID=$(gh api "repos/${{ github.repository }}/releases/tags/$V" --jq .id)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Release id: $ID"

  desktop-builds:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: macos
          - runner: windows-latest
            os: windows
          - runner: ubuntu-22.04
            os: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file libssl-dev libxdo-dev patchelf

      - name: Determine target
        id: target
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "macos" ]; then
            # universal for production, arm64-only for dev/staging (faster)
            if [ "${{ needs.setup.outputs.is_production }}" == "true" ]; then
              echo "target=universal-apple-darwin" >> "$GITHUB_OUTPUT"
              echo "rust_targets=aarch64-apple-darwin,x86_64-apple-darwin" >> "$GITHUB_OUTPUT"
            else
              echo "target=aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
              echo "rust_targets=aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ matrix.os }}" == "windows" ]; then
            echo "target=x86_64-pc-windows-msvc" >> "$GITHUB_OUTPUT"
            echo "rust_targets=x86_64-pc-windows-msvc" >> "$GITHUB_OUTPUT"
          else
            echo "target=x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
            echo "rust_targets=x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.target.outputs.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify repo version matches the tag
        shell: bash
        run: node scripts/sync-version.mjs "${VERSION#v}" --check
        env:
          VERSION: ${{ needs.setup.outputs.version }}

      - name: Configure updater endpoint
        shell: bash
        run: node scripts/configure-updater.mjs
        env:
          DOWNLOADS_URL: ${{ needs.setup.outputs.downloads_url }}

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          # Updater signing. The minisign private key + its password sign the
          # updater artifacts so the embedded pubkey can verify them. Empty
          # secrets => tauri-action skips updater signing and the build still
          # succeeds (just without verifiable updates).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked in at compile time (option_env!). Absent => the build ships
          # without a telemetry sink and only ever writes the local event log,
          # which is exactly what a dev build should do.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          # macOS code signing / notarization is intentionally NOT wired here:
          # passing empty APPLE_CERTIFICATE makes tauri-action attempt
          # `security import` on an empty cert and fail. To enable signing, add a
          # real Apple Developer ID cert and set these env (only when non-empty):
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          # Until then macOS builds ad-hoc (unsigned) and succeeds, like Win/Linux.
          # Windows Authenticode is config-driven: add
          # `bundle.windows.certificateThumbprint` to tauri.conf.json + a runner cert.
        with:
          releaseId: ${{ needs.setup.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.os == 'windows' && format('--target {0} --bundles nsis', steps.target.outputs.target) || format('--target {0}', steps.target.outputs.target) }}

  mirror-to-s3:
    needs: [setup, desktop-builds]
    if: needs.desktop-builds.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          sleep 20
          mkdir -p assets && cd assets
          gh release download "${{ needs.setup.outputs.version }}" -R "${{ github.repository }}"
          ls -la

      - name: Checksums
        run: |
          cd assets
          for f in *.dmg *.exe *.deb *.rpm *.AppImage; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done || true

      - name: Upload to S3
        run: |
          cd assets
          V="${{ needs.setup.outputs.version }}"
          P="${{ needs.setup.outputs.s3_path }}"
          base="s3://aircast-artifacts/$P/flasher/$V"
          # Installers + their .sig (the updater downloads the platform artifact
          # plus its detached .sig signature for verification).
          for f in *.dmg *.dmg.sha256 *.dmg.sig *.app.tar.gz *.app.tar.gz.sha256 *.app.tar.gz.sig; do [ -f "$f" ] && aws s3 cp "$f" "$base/macos/$f" --acl public-read; done || true
          for f in *.exe *.exe.sha256 *.exe.sig; do [ -f "$f" ] && aws s3 cp "$f" "$base/windows/$f" --acl public-read; done || true
          for f in *.deb *.deb.sha256 *.rpm *.rpm.sha256 *.AppImage *.AppImage.sha256 *.AppImage.sig; do [ -f "$f" ] && aws s3 cp "$f" "$base/linux/$f" --acl public-read; done || true

      - name: Upload updater manifest
        run: |
          cd assets
          V="${{ needs.setup.outputs.version }}"
          P="${{ needs.setup.outputs.s3_path }}"
          URL="${{ needs.setup.outputs.downloads_url }}"
          # tauri-action writes github.com release-asset URLs into latest.json.
          # This repo is private, so those 404 for the updater on a user's
          # machine — the banner shows and the install silently does nothing.
          # Repoint every platform at the public mirror uploaded above.
          if [ ! -f latest.json ]; then
            echo "::error::No latest.json in the release — the updater has nothing to serve." \
                 "Check TAURI_SIGNING_PRIVATE_KEY is set and createUpdaterArtifacts is on."
            exit 1
          fi
          node ../scripts/rewrite-updater-manifest.mjs latest.json "$URL/flasher/$V"
          aws s3 cp latest.json "s3://aircast-artifacts/$P/flasher/$V/updater/latest.json" --acl public-read
          # Never point the updater at an older build: a re-release of v0.34.x
          # keeps serving whatever newer version is already live.
          CURRENT=$(aws s3 cp "s3://aircast-artifacts/$P/flasher/latest.json" - 2>/dev/null | jq -r '.version // empty' | sed 's/^v//')
          NEWER=$(jq -rn --arg a "${CURRENT:-0.0.0}" --arg b "${V#v}" \
            'def key: [splits("[.-]")] | map(tonumber? // .); ($a | key) < ($b | key)')
          if [ "$NEWER" = "true" ]; then
            aws s3 cp latest.json "s3://aircast-artifacts/$P/flasher/latest.json" --acl public-read --cache-control "no-cache"
          else
            echo "::warning::updater latest.json stays at $CURRENT; $V is not newer"
          fi

      - name: Update flasher/releases.json
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cd assets
          V="${{ needs.setup.outputs.version }}"
          P="${{ needs.setup.outputs.s3_path }}"
          URL="${{ needs.setup.outputs.downloads_url }}"
          PRE="${{ needs.setup.outputs.is_production != 'true' }}"
          INFO=$(gh api repos/${{ github.repository }}/releases/tags/$V)
          CREATED=$(echo "$INFO" | jq -r '.created_at')
          NOTES=$(echo "$INFO" | jq -r '.body // ""')
          REL_URL=$(echo "$INFO" | jq -r '.html_url')

          PLATFORMS='{}'
          add() { # os key file
            local os="$1" key="$2" file="$3"
            [ -f "$file" ] || return 0
            local sz; sz=$(stat -c%s "$file")
            local u="$URL/flasher/$V/$os/$file"
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg o "$os" --arg k "$key" --arg fn "$file" --arg sz "$sz" --arg url "$u" \
              '.[$o][$k] = {filename:$fn, size:($sz|tonumber), download_url:$url, checksum_url:($url+".sha256")}')
          }
          add macos dmg "$(ls *.dmg 2>/dev/null | head -1)"
          add windows exe "$(ls *.exe 2>/dev/null | head -1)"
          add linux deb "$(ls *.deb 2>/dev/null | head -1)"
          add linux rpm "$(ls *.rpm 2>/dev/null | head -1)"
          add linux appimage "$(ls *.AppImage 2>/dev/null | head -1)"

          jq -n --arg v "$V" --argjson pre "$PRE" --arg c "$CREATED" --arg n "$NOTES" --arg r "$REL_URL" --argjson p "$PLATFORMS" \
            '{version:$v, prerelease:$pre, created_at:$c, release_notes:$n, github_release_url:$r, platforms:$p}' > new.json

          KEY="$P/flasher/releases.json"
          aws s3 cp "s3://aircast-artifacts/$KEY" existing.json 2>/dev/null || echo '{"releases":[]}' > existing.json
          jq --slurpfile new new.json \
            'def key: .version | ltrimstr("v") | [splits("[.-]")] | map(tonumber? // .);
             .releases = ([$new[0]] + [.releases[] | select(.version != $new[0].version)] | sort_by(key) | reverse)' \
            existing.json > releases.json
          aws s3 cp releases.json "s3://aircast-artifacts/$KEY" --acl public-read

      - name: Invalidate CloudFront
        run: |
          V="${{ needs.setup.outputs.version }}"
          DOMAIN="${{ needs.setup.outputs.cloudfront_domain }}"
          ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Aliases.Items, '$DOMAIN')].Id" --output text)
          if [ -n "$ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$ID" --paths "/flasher/releases.json" "/flasher/latest.json" "/flasher/$V/*" >/dev/null
            echo "Invalidated CloudFront for $DOMAIN"
          else
            echo "No CloudFront distribution found for $DOMAIN (skipping)"
          fi

      - name: Verify the published updater is installable
        run: |
          URL="${{ needs.setup.outputs.downloads_url }}"
          node scripts/verify-updater-manifest.mjs "$URL/flasher/latest.json"

  cleanup-old-releases:
    needs: [setup, desktop-builds, mirror-to-s3]
    if: always() && needs.desktop-builds.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Cleanup old releases
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          P="${{ needs.setup.outputs.s3_path }}"
          ENV="${{ needs.setup.outputs.environment }}"
          DOMAIN="${{ needs.setup.outputs.cloudfront_domain }}"
          KEEP_COUNT=5

          # Match only this channel's tags (double-escaped for jq's regex).
          if [ "${{ needs.setup.outputs.is_production }}" == "true" ]; then
            TAG_PATTERN='^v[0-9]+\\.[0-9]+\\.[0-9]+$'
          elif [ "$ENV" == "staging" ]; then
            TAG_PATTERN='^v.*-staging\\..*$'
          else
            TAG_PATTERN='^v.*-dev\\..*$'
          fi

          RELEASES=$(gh api repos/${{ github.repository }}/releases \
            --paginate \
            --jq "[.[] | select(.tag_name | test(\"$TAG_PATTERN\")) | {id: .id, tag_name: .tag_name, created_at: .created_at}] | sort_by(.created_at) | reverse")

          TOTAL_COUNT=$(echo "$RELEASES" | jq 'length')
          echo "Found $TOTAL_COUNT releases for $ENV"

          VERSIONS_TO_KEEP=$(echo "$RELEASES" | jq -r ".[0:$KEEP_COUNT] | .[].tag_name")

          if [ "$TOTAL_COUNT" -gt "$KEEP_COUNT" ]; then
            RELEASES_TO_DELETE=$(echo "$RELEASES" | jq ".[$KEEP_COUNT:]")
            DELETE_COUNT=$(echo "$RELEASES_TO_DELETE" | jq 'length')
            echo "Deleting $DELETE_COUNT old releases..."

            echo "$RELEASES_TO_DELETE" | jq -c '.[]' | while read -r release; do
              RELEASE_ID=$(echo "$release" | jq -r '.id')
              TAG_NAME=$(echo "$release" | jq -r '.tag_name')
              echo "Processing: $TAG_NAME"
              gh api -X DELETE repos/${{ github.repository }}/releases/$RELEASE_ID || true
              gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/$TAG_NAME || true
              aws s3 rm "s3://aircast-artifacts/$P/flasher/$TAG_NAME/" --recursive || true
            done
            echo "Kept latest $KEEP_COUNT releases"
          else
            echo "No cleanup needed ($TOTAL_COUNT <= $KEEP_COUNT)"
          fi

          # Prune deleted versions from releases.json.
          KEY="$P/flasher/releases.json"
          if aws s3 cp "s3://aircast-artifacts/$KEY" releases.json 2>/dev/null; then
            KEEP_JSON=$(echo "$VERSIONS_TO_KEEP" | jq -R -s 'split("\n") | map(select(length > 0))')
            jq --argjson keep "$KEEP_JSON" \
              '.releases = [.releases[] | select(.version as $v | $keep | index($v))]' \
              releases.json > releases-cleaned.json
            BEFORE=$(jq '.releases | length' releases.json)
            AFTER=$(jq '.releases | length' releases-cleaned.json)
            echo "releases.json: $BEFORE -> $AFTER entries"
            if [ "$BEFORE" != "$AFTER" ]; then
              aws s3 cp releases-cleaned.json "s3://aircast-artifacts/$KEY" --acl public-read
            fi
          fi

          # Invalidate CloudFront so the pruned catalog is served immediately.
          ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Aliases.Items, '$DOMAIN')].Id" --output text)
          if [ -n "$ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$ID" --paths "/flasher/releases.json" "/flasher/latest.json" >/dev/null
            echo "Invalidated CloudFront for $DOMAIN"
          fi

  notify:
    needs: [setup, desktop-builds, mirror-to-s3, cleanup-old-releases]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## Aircast Flasher Release"
            echo "- **Version:** ${{ needs.setup.outputs.version }} (${{ needs.setup.outputs.environment }})"
            echo "- **Builds:** ${{ needs.desktop-builds.result }}"
            echo "- **S3 mirror:** ${{ needs.mirror-to-s3.result }}"
            echo "- **Downloads:** ${{ needs.setup.outputs.downloads_url }}/flasher/${{ needs.setup.outputs.version }}/"
            echo "- **Catalog:** ${{ needs.setup.outputs.downloads_url }}/flasher/releases.json"
          } >> "$GITHUB_STEP_SUMMARY"
