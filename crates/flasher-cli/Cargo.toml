[package]
name = "flasher-cli"
description = "Aircast Flasher on the command line, and as an MCP server for agents."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aircast-flasher-cli"
path = "src/main.rs"

[dependencies]
flasher-ops = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.6", features = ["derive", "env"] }
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
schemars = "1"
indicatif = "0.18"
open = "5"
futures-util = "0.3"
tokio-util = "0.7"
