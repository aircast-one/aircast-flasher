[package]
name = "flasher-core"
description = "Pure logic for aircast image provisioning: WPA-PSK derivation and first-boot file generation (cloud-init / firstrun)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

pbkdf2 = "0.12"
hmac = "0.12"
sha1 = "0.10"
hex = "0.4"

sha2 = "0.10"

fatfs = "0.3"
fscommon = "0.1"
mbrman = "0.5"
gptman = "3.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[dev-dependencies]
serde_norway = "0.9.42"
