[package]
name = "flasher-ops"
description = "Releases, card discovery, image download, elevated flashing, Aircast Cloud and tailnet calls shared by the Aircast Flasher app and CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
no-real-devices = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
flasher-core = { workspace = true }

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
futures-util = "0.3"
sha2 = "0.10"
xz2 = { version = "0.1", features = ["static"] }
flate2 = "1"
byte-unit = "5"
url = "2.5"
base64 = "0.22"
getrandom = "0.3"
dirs = "6"
rockusb = { version = "0.4", features = ["nusb"] }
rockfile = "0.1"
nusb = "0.2"
futures = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.6"
security-framework-sys = "2"
