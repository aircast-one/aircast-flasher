[package]
name = "aircast-flasher"
description = "Aircast SD-card flasher — flash the aircast Raspberry Pi image and set WiFi + hostname."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "aircast_flasher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
wdio = ["dep:tauri-plugin-wdio-webdriver", "flasher-ops/no-real-devices"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
flasher-ops = { workspace = true }

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
