[package]
name = "aircast-flasher"
description = "Aircast SD-card flasher — flash the aircast Raspberry Pi image and set WiFi + hostname."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin (Windows; see
# rust-lang/cargo#8519).
name = "aircast_flasher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
flasher-core = { workspace = true }

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
futures-util = "0.3"
sha2 = "0.10"
xz2 = "0.1"
flate2 = "1"
byte-unit = "5"
url = "2.5"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.6"
security-framework-sys = "2"
